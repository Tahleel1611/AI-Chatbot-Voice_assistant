<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friday AI Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"](https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css") rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="theme-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Friday <span class="text-primary">AI Assistant</span></h2>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm">Switch Theme</button>
        </div>
        <div class="card shadow chat-card mb-3">
            <div id="chat-box" class="chat-box"></div>
        </div>
        <div id="loader" class="loader mb-3" style="display:none;">Thinking...</div>
        <form id="command-form" class="input-group">
            <input id="command-input" type="text" class="form-control" placeholder="Type your command..." autocomplete="off" required>
            <button id="send-btn" type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
