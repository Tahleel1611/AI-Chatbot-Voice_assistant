[assistant]
name = "Friday AI"
version = "1.0.0"

[greetings]
welcome = "Hello, I am your AI assistant. How can I assist you today?"
goodbye = "Goodbye! Have a great day!"

[settings]
language = "en-in"
pause_threshold = 1.0
max_retries = 3
speech_timeout = 5

exit_commands = ["exit", "goodbye", "quit", "stop"]

[logging]
level = "INFO"